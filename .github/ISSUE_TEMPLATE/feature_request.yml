name: Feature request
description: Suggest an idea for LaunchPad
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the project
      options:
        - label: This works without adding a required dependency
