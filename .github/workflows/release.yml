name: Release

# Push a tag such as v1.0.0 to publish LaunchPad-Kit.zip on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: python -m unittest discover -s tests -v
      - name: Build the download kit
        run: |
          mkdir -p dist/LaunchPad/static
          cp launchpad.py "Start LaunchPad.bat" start-launchpad.sh README.md LICENSE requirements-optional.txt dist/LaunchPad/
          cp static/dashboard.html dist/LaunchPad/static/
          cd dist && zip -r LaunchPad-Kit.zip LaunchPad
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LaunchPad-Kit.zip
          generate_release_notes: true
